[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "probedriver2"
version = "0.1.0"
description = "Host driver for the ProbeDriver2 Moku:Go custom instrument"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ProbeDriver2 maintainers" }]
dependencies = [
    "moku>=4.2.2.1",
]

[project.scripts]
probedriver2 = "probedriver2.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/probedriver2"]
